<!DOCTYPE html>
<html>
    <head>
        <title>Visit Time || kpoovakan</title>
        <style>
            body {
                background-color: black;
                color: white;
                font-family: sans-serif;
                font-size: 31px;
                position: relative;
                display: block;
                width: 100vw;
                height: 100vh;
                padding: 0;
                margin: 0;
            }
            h1 {
                text-align: center;
                width: 100%;
            }
            h2 {
                text-align: center;
                width: 100%;
            }
            .wrapper {
                display: block;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
        </style>
        <script>
            const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            window.addEventListener("load", async function() {
                await streak();
                mil();
                //sec();
                //min();
            });
            function streak() {
                var streak = Number(window.localStorage.getItem("visittimeStreak"));
                if (streak) {
                    streak++;
                } else {
                    var streak = 1;
                }
                document.getElementById("streak").innerText = streak;
                window.localStorage.setItem("visittimeStreak", streak);
            }
            async function mil() {
                while (true) {
                    //await wait(1);
                    let cur = document.getElementById("mil").innerText;
                    Number(cur);
                    document.getElementById("mil").innerText = cur;
                }
            }
        </script>
    </head>
    <body>
        <div class="wrapper">
            <h1>Visit Time</h1>
            <h2><span id="mil"></span> milliseconds</h2>
            <h2><span id="seconds"></span> seconds</h2>
            <h2><span id="min"></span> minutes</h2>
            <h2>you've visited this page <span id="streak"></span> times</h2>
        </div>
    </body>
</html>
